# PTK Publish Workflow
#
# Publishes the compiled PTK Windows binary to GitHub Releases.
#
# Triggers:
#   - Push a semver tag (v*) whose version matches Cargo.toml
#   - Manual dispatch with an existing tag to re-publish it
#
# Safety properties:
#   - All third-party actions pinned to full commit SHAs (supply-chain safety)
#   - Least-privilege permissions per job
#   - Tag/version mismatch aborts the publish (no accidental releases)
#   - Full test suite gates the build
#   - SHA-256 checksums + SLSA build provenance attestation on assets
#   - Concurrency guard per tag

name: Publish PTK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)publish, e.g. v0.48.0'
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: "1.91"

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and validate version
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not valid semver (expected vX.Y.Z[-prerelease])"
            exit 1
          fi
          VERSION="${TAG#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version '$VERSION' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Publishing PTK v$VERSION (prerelease=$PRERELEASE)"

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.TOOLCHAIN }}

      - name: Run tests
        run: cargo test --all

  build-windows:
    name: Build windows-x64
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          set -euo pipefail
          ARTIFACT="ptk-${{ needs.validate.outputs.tag }}-x86_64-pc-windows-gnu.zip"
          (cd target/x86_64-pc-windows-gnu/release && zip -9 "$GITHUB_WORKSPACE/$ARTIFACT" ptk.exe)
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACT }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ptk-windows-x64
          path: ${{ env.ARTIFACT }}

  release:
    name: Create GitHub Release
    needs: [validate, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ptk-windows-x64
          path: release-assets

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: PTK ${{ needs.validate.outputs.tag }}
          files: release-assets/*
          prerelease: ${{ needs.validate.outputs.prerelease }}
          generate_release_notes: true
