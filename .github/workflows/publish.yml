# PTK Publish Workflow
#
# Publishes the compiled PTK Windows binary to GitHub Releases.
#
# Triggers:
#   - Push a semver tag (v*) whose version matches Cargo.toml
#   - Manual dispatch with an existing tag to re-publish it
#
# Safety properties:
#   - All third-party actions pinned to full commit SHAs (supply-chain safety)
#   - Least-privilege permissions per job
#   - Tag/version mismatch aborts the publish (no accidental releases)
#   - Full test suite gates the build
#   - SHA-256 checksums + SLSA build provenance attestation on assets
#   - Concurrency guard per tag

name: Publish PTK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)publish, e.g. v0.48.0'
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: "1.91"

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and validate version
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not valid semver (expected vX.Y.Z[-prerelease])"
            exit 1
          fi
          VERSION="${TAG#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version '$VERSION' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Publishing PTK v$VERSION (prerelease=$PRERELEASE)"

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.TOOLCHAIN }}

      - name: Run tests
        run: cargo test --all

  build:
    name: Build ${{ matrix.target }}
    needs: [validate, test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel & Apple Silicon
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin_name: ptk
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin_name: ptk
          # Linux musl (static) & arm64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            bin_name: ptk
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            bin_name: ptk
            cross: true
          # Windows MSVC & GNU
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin_name: ptk.exe
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            archive: zip
            bin_name: ptk.exe
            mingw: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools (Linux musl)
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install mingw-w64 tools (Windows GNU)
        if: matrix.mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 zip
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Inspect build output
        shell: bash
        run: |
          ls -la target/${{ matrix.target }}/release/

      - name: Package (Unix tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf "$GITHUB_WORKSPACE/ptk-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.tar.gz" ${{ matrix.bin_name }}

      - name: Package (Windows MSVC zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.bin_name }} -DestinationPath "$env:GITHUB_WORKSPACE/ptk-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.zip"

      - name: Package (Windows GNU zip)
        if: matrix.mingw
        run: |
          cd target/${{ matrix.target }}/release
          zip -9 "$GITHUB_WORKSPACE/ptk-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.zip" ${{ matrix.bin_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptk-${{ matrix.target }}
          path: ptk-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: PTK ${{ needs.validate.outputs.tag }}
          files: release-assets/*
          prerelease: ${{ needs.validate.outputs.prerelease }}
          generate_release_notes: true
