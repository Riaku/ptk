name: CD

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════
  # FEATURE BRANCHES: Pre-release tags
  # ═══════════════════════════════════════════════

  pre-release:
    # Pre-release tags belong to unmerged work: a manual dispatch from any branch
    # other than the trunk. A push to main tags a release instead, so the two
    # paths can never both claim the same commit.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref != 'refs/heads/main'
      && !startsWith(github.ref, 'refs/pull/')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute the pre-release tag
        id: tag
        run: |
          set +e
          VERSION=$(bash scripts/next-version.sh)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 3 ]; then
            # Nothing releasable since the last stable tag. A pre-release still has a
            # job to do — exercising an unmerged branch — so preview the next patch.
            BASE=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
            IFS='.' read -r MAJOR MINOR PATCH <<<"$BASE"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "No releasable commits; previewing the next patch as $VERSION"
          elif [ "$STATUS" -ne 0 ]; then
            echo "::error::next-version.sh failed (exit $STATUS)"
            exit "$STATUS"
          fi
          TAG="dev-${VERSION}-rc.${{ github.run_number }}"
          echo "Pre-release tag: $TAG"

          # Safety: fail if this exact tag already exists
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

          # Tag before building: release.yml checks out this tag, so a build must not
          # start against a ref that does not exist yet — and the assets must belong to
          # a named commit rather than to whatever the branch says at build time.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Pre-release $TAG"
          git push origin "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"


  build-prerelease:
    name: Build pre-release
    needs: pre-release
    if: needs.pre-release.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.pre-release.outputs.tag }}
      prerelease: true
    permissions:
      contents: write
    secrets: inherit

  # ═══════════════════════════════════════════════
  # MAIN PATH: Full release
  # ═══════════════════════════════════════════════

  release:
    name: Tag the release
    # A push to main is the only trigger: a merged change ships, and nothing else does. Not a
    # pull request (the head of an unmerged branch must never publish), not a manual dispatch
    # on main (that would cut a version no merge produced — release.yml can republish an
    # existing tag when a build needs redoing).
    #
    # The version-bump commit this job pushes must not start another release, so its subject
    # skips the job. Only the subject: a merge whose *body* quotes `chore(release): vX.Y.Z`
    # is ordinary work, and matching the whole message silently skipped a release once.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check app credentials
        id: app-creds
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        # Optional: without App credentials the job uses the default token. The
        # difference is that a pull request opened with the default token gets no CI,
        # which no longer matters here — this path opens no pull request.
        if: steps.app-creds.outputs.configured == 'true'
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          # Tags carry the release history the version is measured against.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Compute the next version from the commits
        id: version
        run: |
          set +e
          VERSION=$(bash scripts/next-version.sh)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 3 ]; then
            echo "Nothing releasable since the last tag — docs, CI, chores. No release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::next-version.sh failed (exit $STATUS)"
            exit "$STATUS"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next release: v$VERSION"

      # Cheap gate on the exact commit being published. Pull-request CI already
      # validated this tree, but a merge commit can combine two green branches into
      # something nobody compiled, and this tag is permanent. The lib target is ~4k
      # tests in seconds once built.
      - name: Compile and test the commit being tagged
        if: steps.version.outputs.version != ''
        run: cargo test -p ptk --lib

      - name: Write the version and the changelog, then tag
        id: tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          bash scripts/set-version.sh "$VERSION"
          # Cargo.lock pins the workspace members' versions as well, so resolve it
          # here rather than shipping a lockfile that disagrees with the manifests.
          cargo metadata --format-version 1 > /dev/null

          section=$(mktemp)
          bash scripts/release-notes.sh "$VERSION" > "$section"
          { cat "$section"; cat CHANGELOG.md; } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml engine/Cargo.toml plugin/Cargo.toml text/Cargo.toml \
                  proxy/Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git tag -a "$TAG" -m "v${VERSION}"

          git push origin HEAD:main
          git push origin "$TAG"

          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tagged $TAG on $(git rev-parse --short HEAD)"

  build-release:
    name: Build and upload release assets
    needs: release
    if: ${{ needs.release.outputs.tagged == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit

  update-latest-tag:
    name: Update 'latest' tag
    needs: [release, build-release]
    if: ${{ needs.release.outputs.tagged == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check app credentials
        id: app-creds
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        # Optional: without App credentials the job uses the default token.
        if: steps.app-creds.outputs.configured == 'true'
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Latest stable release (${{ needs.release.outputs.tag }})"
          git push origin latest --force
