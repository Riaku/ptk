name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple silicon only. An Intel Mac has no release asset: it
          # builds from source (see docs/guide/getting-started/installation.md).
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Linux
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Package the commit the tag names. A workflow_call run otherwise checks out
          # the caller's ref, so a merge landing during the build would ship the new
          # code under the old version number.
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, untagged
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The one CLI edition published. Apache-2.0, built without the BUSL
      # engine, so only LICENSE travels with the archive. The binary is still
      # named `ptk` inside, so hook commands already in an agent's settings
      # keep working. The engine edition is a source build only -- there is no
      # `ptk-<target>` release asset.
      - name: Build ptk (Apache-2.0 edition)
        run: cargo build --release --no-default-features --target ${{ matrix.target }}
        env:
          PTK_TELEMETRY_URL: ${{ vars.PTK_TELEMETRY_URL }}
          PTK_TELEMETRY_TOKEN: ${{ secrets.PTK_TELEMETRY_TOKEN }}

      - name: Package ptk-oss (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp LICENSE target/${{ matrix.target }}/release/LICENSE
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../ptk-oss-${{ matrix.target }}.${{ matrix.archive }} ptk LICENSE
          cd ../../..

      - name: Package ptk-oss (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp LICENSE target/${{ matrix.target }}/release/LICENSE
          cd target/${{ matrix.target }}/release
          7z a ../../../ptk-oss-${{ matrix.target }}.${{ matrix.archive }} ptk.exe LICENSE
          cd ../../..

      - name: Upload ptk-oss artifact
        uses: actions/upload-artifact@v7
        with:
          name: ptk-oss-${{ matrix.target }}
          path: ptk-oss-${{ matrix.target }}.${{ matrix.archive }}

      # The daemon ships as its own archive rather than inside the ptk one.
      # It is licensed BUSL-1.1, not Apache-2.0, so bundling it would hand
      # every ptk user a binary under different terms without them choosing
      # it. The BSL requires its text to travel with the work, hence the
      # LICENSE alongside the binary, plus LICENSE-ENGINE for the ptk-engine
      # crate the daemon links.
      #
      # `--target-dir target` keeps the output where the packaging steps look:
      # proxy/ is not a workspace member, so its default target dir would be
      # proxy/target/.
      - name: Build ptk-proxy
        id: build_proxy
        run: >
          cargo build --release
          --manifest-path proxy/Cargo.toml
          --target-dir target
          --target ${{ matrix.target }}
        env:
          CFLAGS_x86_64_unknown_linux_musl: "-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t"

      - name: Package ptk-proxy (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp proxy/LICENSE target/${{ matrix.target }}/release/LICENSE
          cp engine/LICENSE target/${{ matrix.target }}/release/LICENSE-ENGINE
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../ptk-proxy-${{ matrix.target }}.${{ matrix.archive }} ptk-proxy LICENSE LICENSE-ENGINE
          cd ../../..

      - name: Package ptk-proxy (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp proxy/LICENSE target/${{ matrix.target }}/release/LICENSE
          cp engine/LICENSE target/${{ matrix.target }}/release/LICENSE-ENGINE
          cd target/${{ matrix.target }}/release
          7z a ../../../ptk-proxy-${{ matrix.target }}.${{ matrix.archive }} ptk-proxy.exe LICENSE LICENSE-ENGINE
          cd ../../..

      - name: Upload ptk-proxy artifact
        uses: actions/upload-artifact@v7
        with:
          name: ptk-proxy-${{ matrix.target }}
          path: ptk-proxy-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check app credentials
        id: app-creds
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        # Optional, like cd.yml: without App credentials the release still
        # publishes on the default workflow token. Otherwise the only install
        # channel produces nothing at all.
        if: steps.app-creds.outputs.configured == 'true'
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*
          prerelease: ${{ inputs.prerelease }}
          token: ${{ steps.app-token.outputs.token || github.token }}
