name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      ref:
        description: 'Commit the assets were built from; the tag is created here once the build is green'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
      ref:
        description: 'Commit to build and tag (leave empty to build the tag itself)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple silicon only: Intel Macs have no release asset and
          # build from source (docs/guide/getting-started/installation.md).
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Linux — musl on both architectures: statically linked, so the
          # binary does not inherit the build machine's glibc version. A
          # glibc aarch64 build linked against ubuntu-latest symbols (2.39)
          # refuses to start on Debian 12, Ubuntu 22.04 or RHEL 9.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
            # Zig ships clang plus musl libc for every target it knows, so the
            # cross C compiler comes from a PyPI wheel instead of musl.cc.
            build: cargo zigbuild
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Package the commit the tag names. A workflow_call run otherwise checks out
          # the caller's ref, so a merge landing during the build would ship the new
          # code under the old version number. `ref` is set when the tag does not exist
          # yet: cd.yml bumps the version, builds that commit, and only then tags it.
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, untagged
        with:
          targets: ${{ matrix.target }}

      # musl-tools from apt is an x86_64-hosted musl-gcc and nothing more.
      # The arm64 leg also needs a cross C compiler, because the build compiles
      # C for the target (rusqlite's bundled SQLite, ring). rustc statically
      # links the musl binary in both cases, which is the whole point: no
      # dependency on the machine's glibc.
      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The arm64 C compiler used to come from musl.cc. That host stopped
      # answering GitHub's runners (curl 28 on every mirror, twice in a row,
      # while the same URL was up from elsewhere), and a build leg that cannot
      # fetch its toolchain costs the whole release: Create Release needs all
      # four legs. Zig ships clang and musl libc for every target it knows and
      # arrives as a PyPI wheel, so cargo-zigbuild gives the same static musl
      # artifact without a third-party tarball in the critical path.
      - name: Install zig cross C compiler
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --break-system-packages "ziglang==0.13.0"
          zig="$(python3 -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          sudo chmod +x "$zig"
          sudo ln -sf "$zig" /usr/local/bin/zig
          zig version

      - name: Install cargo-zigbuild
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cargo-zigbuild --locked --version 0.23.4

      - name: Build ptk
        run: ${{ matrix.build || 'cargo build' }} --release --target ${{ matrix.target }}
        env:
          PTK_TELEMETRY_URL: ${{ vars.PTK_TELEMETRY_URL }}
          PTK_TELEMETRY_TOKEN: ${{ secrets.PTK_TELEMETRY_TOKEN }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          # The binary links the BUSL-1.1 ptk-engine, so both texts travel
          # with every artifact: LICENSE (Apache-2.0, the CLI sources) and
          # LICENSE-ENGINE (BUSL-1.1, the linked engine).
          cp LICENSE target/${{ matrix.target }}/release/LICENSE
          cp engine/LICENSE target/${{ matrix.target }}/release/LICENSE-ENGINE
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../ptk-${{ matrix.target }}.${{ matrix.archive }} ptk LICENSE LICENSE-ENGINE
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp LICENSE target/${{ matrix.target }}/release/LICENSE
          cp engine/LICENSE target/${{ matrix.target }}/release/LICENSE-ENGINE
          cd target/${{ matrix.target }}/release
          7z a ../../../ptk-${{ matrix.target }}.${{ matrix.archive }} ptk.exe LICENSE LICENSE-ENGINE
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ptk-${{ matrix.target }}
          path: ptk-${{ matrix.target }}.${{ matrix.archive }}

      # The Apache-2.0 edition: the same binary built without the BUSL engine,
      # so only LICENSE travels with it. Same binary name `ptk` inside -- an
      # installed hook command must keep working across editions.
      - name: Build ptk (Apache-2.0 edition)
        run: ${{ matrix.build || 'cargo build' }} --release --no-default-features --target ${{ matrix.target }}
        env:
          PTK_TELEMETRY_URL: ${{ vars.PTK_TELEMETRY_URL }}
          PTK_TELEMETRY_TOKEN: ${{ secrets.PTK_TELEMETRY_TOKEN }}

      - name: Package ptk-oss (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp LICENSE target/${{ matrix.target }}/release/LICENSE
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../ptk-oss-${{ matrix.target }}.${{ matrix.archive }} ptk LICENSE
          cd ../../..

      - name: Package ptk-oss (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp LICENSE target/${{ matrix.target }}/release/LICENSE
          cd target/${{ matrix.target }}/release
          7z a ../../../ptk-oss-${{ matrix.target }}.${{ matrix.archive }} ptk.exe LICENSE
          cd ../../..

      - name: Upload ptk-oss artifact
        uses: actions/upload-artifact@v7
        with:
          name: ptk-oss-${{ matrix.target }}
          path: ptk-oss-${{ matrix.target }}.${{ matrix.archive }}

      # The daemon ships as its own archive rather than inside the ptk one.
      # It is licensed BUSL-1.1, not Apache-2.0, so bundling it would hand
      # every ptk user a binary under different terms without them choosing
      # it. The BSL requires its text to travel with the work, hence the
      # LICENSE alongside the binary, plus LICENSE-ENGINE for the ptk-engine
      # crate the daemon links.
      #
      # `--target-dir target` keeps the output where the packaging steps look:
      # proxy/ is not a workspace member, so its default target dir would be
      # proxy/target/.
      - name: Build ptk-proxy
        id: build_proxy
        run: >
          ${{ matrix.build || 'cargo build' }} --release
          --locked
          --manifest-path proxy/Cargo.toml
          --target-dir target
          --target ${{ matrix.target }}
        env:
          # Some vendored C in the daemon's graph assumes the BSD u_int*_t
          # types, which musl does not provide through <sys/types.h>.
          CFLAGS_x86_64_unknown_linux_musl: "-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t"
          CFLAGS_aarch64_unknown_linux_musl: "-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t"

      - name: Package ptk-proxy (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp proxy/LICENSE target/${{ matrix.target }}/release/LICENSE
          cp engine/LICENSE target/${{ matrix.target }}/release/LICENSE-ENGINE
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../ptk-proxy-${{ matrix.target }}.${{ matrix.archive }} ptk-proxy LICENSE LICENSE-ENGINE
          cd ../../..

      - name: Package ptk-proxy (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp proxy/LICENSE target/${{ matrix.target }}/release/LICENSE
          cp engine/LICENSE target/${{ matrix.target }}/release/LICENSE-ENGINE
          cd target/${{ matrix.target }}/release
          7z a ../../../ptk-proxy-${{ matrix.target }}.${{ matrix.archive }} ptk-proxy.exe LICENSE LICENSE-ENGINE
          cd ../../..

      - name: Upload ptk-proxy artifact
        uses: actions/upload-artifact@v7
        with:
          name: ptk-proxy-${{ matrix.target }}
          path: ptk-proxy-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check app credentials
        id: app-creds
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        # Optional, like cd.yml: without App credentials the release still
        # publishes on the default workflow token. Otherwise the only install
        # channel produces nothing at all.
        if: steps.app-creds.outputs.configured == 'true'
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth 0 and a token that can push: this job creates the tag once every
          # leg above has built, so the commit being tagged has to be on disk here.
          ref: ${{ inputs.ref || inputs.tag }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      # The tag is cut here rather than before the build, so an unreachable toolchain host
      # or a failing test leaves no tag behind. Tagging and publishing happen in the same
      # job, so the two can no longer disagree either: every release object has assets.
      - name: Tag the commit the assets were built from
        if: inputs.ref != ''
        env:
          TAG: ${{ steps.version.outputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$REF" ]; then
            echo "::error::checked out $HEAD_SHA but the assets were built from $REF"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists; publishing onto it."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/${TAG}"
          echo "Tagged ${TAG} on ${HEAD_SHA} after a green build of every leg."

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*
          prerelease: ${{ inputs.prerelease }}
          token: ${{ steps.app-token.outputs.token || github.token }}
