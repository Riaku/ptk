name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Linux
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RTK_TELEMETRY_URL: ${{ vars.RTK_TELEMETRY_URL }}
          RTK_TELEMETRY_TOKEN: ${{ secrets.RTK_TELEMETRY_TOKEN }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../ptk-${{ matrix.target }}.${{ matrix.archive }} ptk
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../ptk-${{ matrix.target }}.${{ matrix.archive }} ptk.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptk-${{ matrix.target }}
          path: ptk-${{ matrix.target }}.${{ matrix.archive }}

  build-deb:
    name: Build DEB package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build DEB
        run: cargo deb
        env:
          RTK_TELEMETRY_URL: ${{ vars.RTK_TELEMETRY_URL }}
          RTK_TELEMETRY_TOKEN: ${{ secrets.RTK_TELEMETRY_TOKEN }}

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ptk-deb
          path: target/debian/*.deb

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y rust cargo rpm-build

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build release
        run: cargo build --release
        env:
          RTK_TELEMETRY_URL: ${{ vars.RTK_TELEMETRY_URL }}
          RTK_TELEMETRY_TOKEN: ${{ secrets.RTK_TELEMETRY_TOKEN }}

      - name: Generate RPM
        run: cargo generate-rpm

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: ptk-rpm
          path: target/generate-rpm/*.rpm

  release:
    name: Create Release
    needs: [build, build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Check app credentials
        id: app-creds
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v3
        id: app-token
        if: steps.app-creds.outputs.configured == 'true'
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release/ \;

      - name: Create version-agnostic package names
        run: |
          cd release
          for f in *.deb; do
            [ -f "$f" ] && cp "$f" "ptk_amd64.deb"
          done
          for f in *.rpm; do
            [ -f "$f" ] && cp "$f" "ptk.x86_64.rpm"
          done

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: release/*
          prerelease: ${{ inputs.prerelease }}
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  notify-discord:
    name: Notify Discord
    needs: [release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Get version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.RTK_DISCORD_RELEASE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          # Fetch release notes from GitHub API
          NOTES=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.body' 2>/dev/null | head -c 1800 || echo "")
          DESC=$(echo "${NOTES:-No release notes}" | jq -Rs .)

          jq -n \
            --arg title "PTK ${TAG} released" \
            --arg url "$RELEASE_URL" \
            --argjson desc "$DESC" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 5814783, footer: {text: "PTK"}}]}' \
          | curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

  homebrew:
    name: Update Homebrew formula
    needs: [release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Get version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download checksums
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo ${{ github.repository }} \
            --pattern checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse checksums
        id: sha
        run: |
          echo "mac_arm=$(grep aarch64-apple-darwin.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "mac_intel=$(grep x86_64-apple-darwin.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_arm=$(grep aarch64-unknown-linux-gnu.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_intel=$(grep x86_64-unknown-linux-musl.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Generate formula
        run: |
          cat > ptk.rb << 'FORMULA'
          class Ptk < Formula
            desc "PTK - High-performance CLI proxy to minimize LLM token consumption"
            homepage "https://www.rtk-ai.app"
            version "VERSION_PLACEHOLDER"
            license "Apache-2.0"

            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/OWNER_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/ptk-aarch64-apple-darwin.tar.gz"
              sha256 "SHA_MAC_ARM_PLACEHOLDER"
            elsif OS.mac? && Hardware::CPU.intel?
              url "https://github.com/OWNER_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/ptk-x86_64-apple-darwin.tar.gz"
              sha256 "SHA_MAC_INTEL_PLACEHOLDER"
            elsif OS.linux? && Hardware::CPU.arm?
              url "https://github.com/OWNER_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/ptk-aarch64-unknown-linux-gnu.tar.gz"
              sha256 "SHA_LINUX_ARM_PLACEHOLDER"
            elsif OS.linux? && Hardware::CPU.intel?
              url "https://github.com/OWNER_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/ptk-x86_64-unknown-linux-musl.tar.gz"
              sha256 "SHA_LINUX_INTEL_PLACEHOLDER"
            end

            def install
              bin.install "ptk"
            end

            def caveats
              <<~EOS
                ptk is installed! Get started:

                  # Initialize for Claude Code
                  ptk init -g          # Global hook-first setup (recommended)
                  ptk init             # Add to ./CLAUDE.md (this project only)

                  # See all commands
                  ptk --help

                  # Measure your token savings
                  ptk gain
              EOS
            end

            test do
              system "#{bin}/ptk", "--version"
            end
          end
          FORMULA
          sed -i "s/OWNER_PLACEHOLDER/${{ github.repository }}/g" ptk.rb
          sed -i "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/g" ptk.rb
          sed -i "s/TAG_PLACEHOLDER/${{ steps.version.outputs.tag }}/g" ptk.rb
          sed -i "s/SHA_MAC_ARM_PLACEHOLDER/${{ steps.sha.outputs.mac_arm }}/g" ptk.rb
          sed -i "s/SHA_MAC_INTEL_PLACEHOLDER/${{ steps.sha.outputs.mac_intel }}/g" ptk.rb
          sed -i "s/SHA_LINUX_ARM_PLACEHOLDER/${{ steps.sha.outputs.linux_arm }}/g" ptk.rb
          sed -i "s/SHA_LINUX_INTEL_PLACEHOLDER/${{ steps.sha.outputs.linux_intel }}/g" ptk.rb
          # Remove leading spaces from heredoc
          sed -i 's/^          //' ptk.rb

      - name: Push to homebrew-tap
        run: |
          CONTENT=$(base64 -w 0 ptk.rb)
          TAP="${{ github.repository_owner }}/homebrew-tap"
          SHA=$(gh api "repos/$TAP/contents/Formula/ptk.rb" --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api -X PUT "repos/$TAP/contents/Formula/ptk.rb" \
              -f message="ptk ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT" \
              -f sha="$SHA"
          else
            gh api -X PUT "repos/$TAP/contents/Formula/ptk.rb" \
              -f message="ptk ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT"
          fi
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  winget:
    name: Update winget manifest
    needs: [release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    # A failed submission must not fail the release workflow: cd.yml gates
    # update-latest-tag on build-release, so a red job here would leave the
    # 'latest' tag on the previous version.
    continue-on-error: true
    steps:
      - name: Get version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Pinned to a main commit, not the v2 tag: v2 has not moved since 2024-11-27
      # and is four fixes behind, including cargo binstall on ubuntu-slim runners.
      - uses: vedantmgoyal9/winget-releaser@a43926ed822e5a076ac8a81e0a794915cbad51d1 # 2026-03-14
        with:
          identifier: ${{ github.repository_owner }}.ptk
          version: ${{ steps.version.outputs.version }}
          installers-regex: 'ptk-x86_64-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
          release-tag: ${{ steps.version.outputs.tag }}
