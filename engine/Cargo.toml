[package]
name = "ptk-engine"
version = "0.50.1"
edition = "2021"
rust-version = "1.91"
authors = ["PTK AI Labs"]
description = "PTK compression engine: methods, chains, markers, and pipeline primitives"
license = "BUSL-1.1"
publish = false

[dependencies]
ptk-text = { path = "../text" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toon-format = { version = "0.5.0", default-features = false }
htmd = "0.5.5"

[lints.rust]
unsafe_code = "deny"
warnings = "deny"

[dev-dependencies]
tempfile = "3"
